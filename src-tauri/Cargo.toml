[package]
name = "claude-session-exporter"
version = "0.1.0"
description = "Export open Claude Desktop sessions to structured PDFs."
authors = ["Claude Session Exporter Contributors"]
edition = "2021"

[lib]
name = "claude_session_exporter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.6.3", features = [] }
thiserror = "2.0"

[target.'cfg(windows)'.dependencies]
sysinfo = "0.37"
uiautomation = "0.25"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging"
] }
windows-result = "0.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
axuielement = "0.8"
