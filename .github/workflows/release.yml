name: Release

# Windows installers cannot be cross-compiled from macOS, so downloadable
# builds for both platforms are produced here rather than on a developer
# machine. Push a `v*` tag to publish, or run manually to get artifacts only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Check frontend and backend
        run: |
          npm run test
          npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Claude Session Exporter ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your platform below.

            - **macOS** — `.dmg`. The build is unsigned, so the first launch
              needs right-click → Open, or System Settings → Privacy & Security
              → Open Anyway.
            - **Windows** — `.exe` (NSIS, installs for the current user) or
              `.msi`. SmartScreen may warn on an unsigned build: More info →
              Run anyway.
          releaseDraft: true
          prerelease: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-session-exporter-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
